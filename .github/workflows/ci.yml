name: TaskForge CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. Backend Testing & Quality Assurance
  # -------------------------------------------------------------
  backend-test:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskforge_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: "testing"
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          CELERY_BROKER_URL: "redis://localhost:6379/1"
          CELERY_RESULT_BACKEND: "redis://localhost:6379/2"
        run: |
          cd backend
          python -m pytest tests -v --durations=10

  # -------------------------------------------------------------
  # 2. Frontend Testing & Quality Assurance
  # -------------------------------------------------------------
  frontend-test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd frontend
          flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: |
          cd frontend
          flutter test --reporter expanded

  # -------------------------------------------------------------
  # 3. Docker Container Verification
  # -------------------------------------------------------------
  docker-build-verification:
    name: Docker Build Verification
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: taskforge-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: taskforge-frontend:latest

  # -------------------------------------------------------------
  # 4. Continuous Deployment: Flutter Web to Firebase Hosting
  # -------------------------------------------------------------
  deploy-frontend-firebase:
    name: Deploy Flutter Web to Firebase Hosting
    needs: [frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Flutter Web Release
        run: |
          cd frontend
          flutter build web --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || '/api/v1' }}

      - name: Deploy to Firebase Hosting (Service Account)
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_TASKFORGE_PM_APP != '' }}"
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TASKFORGE_PM_APP }}'
          channelId: live
          projectId: taskforge-pm-app

      - name: Deploy to Firebase Hosting (Token Fallback)
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_TASKFORGE_PM_APP == '' && secrets.FIREBASE_TOKEN != '' }}"
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project taskforge-pm-app
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # -------------------------------------------------------------
  # 5. Continuous Deployment: FastAPI Backend to Google Cloud Run
  # -------------------------------------------------------------
  deploy-backend-cloudrun:
    name: Deploy FastAPI Backend to Cloud Run
    needs: [backend-test, docker-build-verification]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Google Cloud SDK
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Container Registry / Artifact Registry
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        run: |
          gcloud auth configure-docker --quiet

      - name: Build and Push Backend Container
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        run: |
          docker build -t gcr.io/taskforge-pm-app/taskforge-backend:${{ github.sha }} -t gcr.io/taskforge-pm-app/taskforge-backend:latest ./backend
          docker push gcr.io/taskforge-pm-app/taskforge-backend:${{ github.sha }}
          docker push gcr.io/taskforge-pm-app/taskforge-backend:latest

      - name: Deploy to Cloud Run
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        run: |
          gcloud run deploy taskforge-backend \
            --image gcr.io/taskforge-pm-app/taskforge-backend:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8000 \
            --set-env-vars "ENVIRONMENT=production"

